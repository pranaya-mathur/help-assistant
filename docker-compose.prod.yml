# Production stack: Redis + API + nginx widget proxy
#
#   cp .env.production.example .env.production
#   # Edit .env.production with OPENAI_API_KEY
#   docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d
#
#   API health:  http://127.0.0.1:8001/api/v1/health
#   Widget demo: http://127.0.0.1:8765/demo.html
#
name: mobcoder-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobcoder
      POSTGRES_PASSWORD: mobcoder
      POSTGRES_DB: mobcoder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobcoder -d mobcoder"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  mobcoder-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      API_PORT: "8080"
      API_RELOAD: "false"
      APP_ENV: production
      SESSION_STORE_BACKEND: postgres
      DATABASE_URL: postgresql://mobcoder:mobcoder@postgres:5432/mobcoder
      AUTO_MIGRATE_DB: "true"
      PERSIST_ANALYTICS_EVENTS: "true"
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    ports:
      - "8001:8080"
    networks:
      - internal

  widget:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./widget:/usr/share/nginx/html:ro
      - ./docker/nginx/widget.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8765:80"
    depends_on:
      mobcoder-api:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  internal:
    driver: bridge
