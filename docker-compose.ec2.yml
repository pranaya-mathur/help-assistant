# EC2 production stack — API + Postgres + Redis (image from ECR via CI/CD)
#
# Full guide: docs/DEVOPS_DEPLOY.md
#
# One-time on EC2:
#   sudo ./scripts/ec2/setup_ec2.sh
#   cp .env.devops.example .env.production && edit secrets (OPENAI_API_KEY, APIFY_API_TOKEN)
#
# Deploy (manual or via GitHub Actions):
#   export ECR_IMAGE=123456789012.dkr.ecr.us-east-1.amazonaws.com/mobcoder-sales-agent:latest
#   export AWS_REGION=us-east-1
#   ./scripts/ec2/deploy.sh
#
# Refresh knowledge after deploy:
#   ./scripts/ec2/reingest.sh
#
name: mobcoder-ec2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobcoder
      POSTGRES_PASSWORD: mobcoder
      POSTGRES_DB: mobcoder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobcoder -d mobcoder"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  mobcoder-api:
    image: ${ECR_IMAGE:?Set ECR_IMAGE — e.g. 123.dkr.ecr.us-east-1.amazonaws.com/mobcoder-sales-agent:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      API_PORT: "8080"
      API_RELOAD: "false"
      APP_ENV: production
      SESSION_STORE_BACKEND: postgres
      DATABASE_URL: postgresql://mobcoder:mobcoder@postgres:5432/mobcoder
      AUTO_MIGRATE_DB: "true"
      PERSIST_ANALYTICS_EVENTS: "true"
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    ports:
      - "${API_HOST_PORT:-80}:8080"
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  internal:
    driver: bridge
