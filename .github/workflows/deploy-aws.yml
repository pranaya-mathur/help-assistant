name: Deploy API to AWS ECS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "prompts/**"
      - "scripts/**"
      - "data/formatted/pages_seed.json"
      - "main.py"
      - "Dockerfile"
      - "requirements.txt"
      - "db/**"
      - "deploy/**"
      - ".github/workflows/deploy-aws.yml"

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY: mobcoder-sales-agent

jobs:
  deploy:
    name: Build and deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Force ECS rolling deployment
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}"
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}"

      - name: Smoke health check
        if: ${{ secrets.API_URL != '' }}
        env:
          API_URL: ${{ secrets.API_URL }}
        run: ./scripts/aws/smoke_health.sh
